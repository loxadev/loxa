name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-core:
    name: Core and leaf checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check core and shared leaves
        run: cargo clippy --locked --workspace --exclude loxa-app --all-targets -- -D warnings
      - name: Test core and shared leaves
        id: core_tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace --exclude loxa-app --all-targets \
            --message-format=json-render-diagnostics \
            | tee "${RUNNER_TEMP}/loxa-test-artifacts.jsonl"
          python3 - "${RUNNER_TEMP}/loxa-test-artifacts.jsonl" <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root_library = (Path(os.environ["GITHUB_WORKSPACE"]) / "src/lib.rs").resolve()
          executables = set()
          with open(sys.argv[1], encoding="utf-8") as artifacts:
              for line in artifacts:
                  try:
                      message = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(message, dict) or message.get("reason") != "compiler-artifact":
                      continue
                  if (
                      message.get("profile", {}).get("test")
                      and message.get("executable")
                      and Path(message["target"]["src_path"]).resolve() == root_library
                  ):
                      executables.add(str(Path(message["executable"]).resolve()))
          if len(executables) != 1:
              raise SystemExit(f"expected one current root library test executable, found {len(executables)}")
          executable = executables.pop()
          test_name = "session::saved::ipc_tests::older_peer_rejects_bound_generation_before_submission"
          listed = subprocess.run(
              [executable, test_name, "--exact", "--list", "--format", "terse"],
              check=True, capture_output=True, text=True, timeout=10,
          )
          if f"{test_name}: test" not in listed.stdout.splitlines():
              raise SystemExit("focused IPC test was not present in the compiled executable")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"test_binary={executable}\n")
          PY
      - name: Verify publishable packages
        run: cargo package --locked -p loxa-ipc -p loxa-diagnostics
      - name: Measure focused IPC test
        id: profile_ipc
        timeout-minutes: 5
        shell: bash
        env:
          LOXA_TEST_BINARY: ${{ steps.core_tests.outputs.test_binary }}
        run: |
          set -euo pipefail
          profile_dir="${RUNNER_TEMP}/loxa-ipc-profile"
          mkdir -p "${profile_dir}"
          test_name='session::saved::ipc_tests::older_peer_rejects_bound_generation_before_submission'
          {
            printf 'commit=%s\n' "${GITHUB_SHA}"
            printf 'runner_image=%s\n' "${ImageOS:-unknown}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'binary_bytes=%s\n' "$(stat -c %s "${LOXA_TEST_BINARY}")"
            printf 'cpu_count=%s\n' "$(nproc)"
            LC_ALL=C lscpu | sed -n '/^Model name:/p'
            rustc --version
            /usr/bin/time --version
          } > "${profile_dir}/metadata.txt"
          timeout --signal=TERM --kill-after=5s 90s \
            /usr/bin/time -v -o "${profile_dir}/baseline.time" \
            "${LOXA_TEST_BINARY}" "${test_name}" --exact --test-threads=1 --nocapture \
            > "${profile_dir}/baseline.log" 2>&1
          cat "${profile_dir}/baseline.log" "${profile_dir}/baseline.time"
          if ! command -v strace > /dev/null; then
            timeout --signal=TERM --kill-after=5s 60s bash -c \
              'sudo apt-get update && sudo apt-get install --no-install-recommends -y strace'
          fi
          strace --version >> "${profile_dir}/metadata.txt"
          # Summary-only tracing records no syscall arguments or payloads.
          # Thread wait durations overlap and do not prove lock contention.
          timeout --signal=TERM --kill-after=5s 90s \
            strace -q -f -c -w -o "${profile_dir}/syscalls.txt" \
            "${LOXA_TEST_BINARY}" "${test_name}" --exact --test-threads=1 --nocapture \
            > "${profile_dir}/traced.log" 2>&1
          cat "${profile_dir}/traced.log" "${profile_dir}/syscalls.txt"
      - name: Upload focused IPC measurements
        if: ${{ always() && steps.profile_ipc.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-ipc-profile
          path: ${{ runner.temp }}/loxa-ipc-profile/
          if-no-files-found: warn

  checks:
    name: Rust checks (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Install coverage tools
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: loxa-app/package.json
      - name: Install app dependencies
        working-directory: loxa-app
        run: pnpm install --frozen-lockfile
      - name: Reject generated or agent-context files
        shell: bash
        run: |
          tracked="$({ git ls-files; } | awk '/(^|\/)(\.superpowers|node_modules|target)(\/|$)/')"
          if [[ -n "$tracked" ]]; then
            echo "Generated or temporary paths must not be tracked:"
            echo "$tracked"
            exit 1
          fi
      - name: Check repository whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Verify committed lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests with coverage
        timeout-minutes: 10
        run: cargo llvm-cov --workspace --all-targets --locked --no-cfg-coverage --json --output-path target/coverage.json
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-coverage
          path: target/coverage.json
      - name: Test runtime bundle finalizer
        working-directory: loxa-app
        run: pnpm run test:runtime-bundle
      - name: Build unsigned macOS app
        working-directory: loxa-app
        run: |
          pnpm exec tauri build --ci --bundles app --no-sign
          node scripts/runtime-bundle.mjs --app ../target/release/bundle/macos/Loxa.app
      - name: Smoke test embedded runtime
        shell: bash
        working-directory: loxa-app
        run: |
          set -euo pipefail
          small_model="${RUNNER_TEMP}/loxa-smollm2-135m-q2-k.gguf"
          trap 'rm -f "${small_model}"' EXIT
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 600 \
            --retry 3 --retry-delay 2 --retry-all-errors --retry-max-time 900 \
            --output "${small_model}" \
            'https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q2_K.gguf'
          test "$(stat -f '%z' "${small_model}")" = '88202080'
          test "$(shasum -a 256 "${small_model}" | awk '{print $1}')" = \
            '741ad12b64088fedc17c33aacb22e48be1972ef36a39f03666dd68bd15614fb9'
          node scripts/runtime-smoke.mjs \
            --app ../target/release/bundle/macos/Loxa.app \
            --model "${small_model}"
          export LOXA_BUILT_APP="$(pwd)/../target/release/bundle/macos/Loxa.app"
          export LOXA_SMALL_MODEL="${small_model}"
          # Keep workspace feature unification for the runtime acceptance tests.
          # Exclude integration harnesses, which already ran in the test step.
          cargo test --locked --workspace --lib --bins \
            app::runtime_acceptance_tests::finalized_app_ \
            -- --ignored --test-threads=1
          cargo test --locked --workspace --lib --bins \
            runner::tests::bundled_ \
            -- --ignored --test-threads=1
          cargo test --locked --workspace --lib --bins \
            api_runtime::tests::bundled_host_prepares_without_ownership_and_reuses_across_model_loads \
            -- --exact --ignored
          cargo test --locked --workspace --lib --bins \
            runtime_bundle::tests::source_replacement_after_inventory_open_cannot_redefine_the_captured_closure \
            -- --exact --ignored
          cargo test --locked --workspace --lib --bins \
            runnable::tests::legacy_provenance_under_bundled_app_selects_and_reports_active_b10344_without_rewrite \
            -- --exact --ignored
