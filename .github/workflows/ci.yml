name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-core:
    name: Core and leaf checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check core and shared leaves
        run: cargo clippy --locked --workspace --exclude loxa-app --all-targets -- -D warnings
      - name: Test core and shared leaves
        run: cargo test --locked --workspace --exclude loxa-app --all-targets
      - name: Verify publishable packages
        run: cargo package --locked -p loxa-ipc -p loxa-diagnostics

  checks:
    name: Rust checks (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Install coverage tools
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: loxa-app/package.json
      - name: Install app dependencies
        working-directory: loxa-app
        run: pnpm install --frozen-lockfile
      - name: Reject generated or agent-context files
        shell: bash
        run: |
          tracked="$({ git ls-files; } | awk '/(^|\/)(\.superpowers|node_modules|target)(\/|$)/')"
          if [[ -n "$tracked" ]]; then
            echo "Generated or temporary paths must not be tracked:"
            echo "$tracked"
            exit 1
          fi
      - name: Check repository whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Verify committed lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests with coverage
        timeout-minutes: 10
        run: cargo llvm-cov --workspace --all-targets --locked --no-cfg-coverage --json --output-path target/coverage.json
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-coverage
          path: target/coverage.json
      - name: Test runtime bundle finalizer
        working-directory: loxa-app
        run: pnpm run test:runtime-bundle
      - name: Build unsigned macOS app
        working-directory: loxa-app
        run: |
          pnpm exec tauri build --ci --bundles app --no-sign
          node scripts/runtime-bundle.mjs --app ../target/release/bundle/macos/Loxa.app
      - name: Smoke test embedded runtime
        shell: bash
        working-directory: loxa-app
        run: |
          set -euo pipefail
          small_model="${RUNNER_TEMP}/loxa-smollm2-135m-q2-k.gguf"
          trap 'rm -f "${small_model}"' EXIT
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 600 \
            --retry 3 --retry-delay 2 --retry-all-errors --retry-max-time 900 \
            --output "${small_model}" \
            'https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q2_K.gguf'
          test "$(stat -f '%z' "${small_model}")" = '88202080'
          test "$(shasum -a 256 "${small_model}" | awk '{print $1}')" = \
            '741ad12b64088fedc17c33aacb22e48be1972ef36a39f03666dd68bd15614fb9'
          node scripts/runtime-smoke.mjs \
            --app ../target/release/bundle/macos/Loxa.app \
            --model "${small_model}"
          export LOXA_BUILT_APP="$(pwd)/../target/release/bundle/macos/Loxa.app"
          export LOXA_SMALL_MODEL="${small_model}"
          # Keep workspace feature unification for the runtime acceptance tests.
          # Exclude integration harnesses, which already ran in the test step.
          cargo test --locked --workspace --lib --bins \
            app::runtime_acceptance_tests::finalized_app_ \
            -- --ignored --test-threads=1
          cargo test --locked --workspace --lib --bins \
            runner::tests::bundled_ \
            -- --ignored --test-threads=1
          cargo test --locked --workspace --lib --bins \
            api_runtime::tests::bundled_host_prepares_without_ownership_and_reuses_across_model_loads \
            -- --exact --ignored
          cargo test --locked --workspace --lib --bins \
            runtime_bundle::tests::source_replacement_after_inventory_open_cannot_redefine_the_captured_closure \
            -- --exact --ignored
          cargo test --locked --workspace --lib --bins \
            runnable::tests::legacy_provenance_under_bundled_app_selects_and_reports_active_b10344_without_rewrite \
            -- --exact --ignored
      - name: Qualify advertised SmolLM2 Q4 with bundled runtime
        id: qualify_smollm2
        timeout-minutes: 10
        shell: bash
        env:
          LOXA_BUILT_APP: ${{ github.workspace }}/target/release/bundle/macos/Loxa.app
          LOXA_ADVERTISED_SMOL_MODEL: ${{ runner.temp }}/loxa-smollm2-135m-q4-k-m.gguf
        run: |
          set -euo pipefail
          LOXA_SMOL_EVIDENCE="$(mktemp -d "${RUNNER_TEMP}/loxa-smollm2-q4-qualification.XXXXXX")"
          export LOXA_SMOL_EVIDENCE
          printf 'evidence_dir=%s\n' "${LOXA_SMOL_EVIDENCE}" >> "${GITHUB_OUTPUT}"
          trap 'rm -f "${LOXA_ADVERTISED_SMOL_MODEL}"' EXIT
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import platform

          metadata = {
              "commit": os.environ["GITHUB_SHA"],
              "runner_image": os.environ.get("ImageOS", "unknown"),
              "runner_image_version": os.environ.get("ImageVersion", "unknown"),
              "architecture": platform.machine(),
          }
          output = Path(os.environ["LOXA_SMOL_EVIDENCE"]) / "runner.json"
          output.write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          PY
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 \
            --retry 2 --retry-delay 2 --retry-all-errors --retry-max-time 180 \
            --output "${LOXA_ADVERTISED_SMOL_MODEL}" \
            'https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q4_K_M.gguf'
          test "$(stat -f '%z' "${LOXA_ADVERTISED_SMOL_MODEL}")" = '105454432'
          test "$(shasum -a 256 "${LOXA_ADVERTISED_SMOL_MODEL}" | awk '{print $1}')" = \
            '2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d'
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import time

          output = Path(os.environ["LOXA_SMOL_EVIDENCE"])
          test_name = "runner::tests::advertised_smollm2_q4_generation_counts_full_history_and_stop"
          started = time.monotonic()
          with (output / "acceptance.log").open("w", encoding="utf-8") as log:
              process = subprocess.Popen(
                  ["cargo", "test", "--locked", "--workspace", "--lib", "--bins", test_name,
                   "--", "--exact", "--ignored", "--test-threads=1", "--nocapture"],
                  cwd=os.environ["GITHUB_WORKSPACE"], stdout=log, stderr=subprocess.STDOUT,
                  start_new_session=True,
              )
              try:
                  outcome = {"exit_code": process.wait(timeout=240), "timed_out": False}
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait(timeout=10)
                  # Engine processes have their own groups; runner timeout cleanup is unknown.
                  outcome = {"exit_code": process.returncode, "timed_out": True, "cleanup": "unknown"}
          outcome["elapsed_seconds"] = time.monotonic() - started
          (output / "outcome.json").write_text(json.dumps(outcome, indent=2) + "\n", encoding="utf-8")
          print((output / "acceptance.log").read_text(encoding="utf-8")[-16384:])
          if outcome["timed_out"] or outcome["exit_code"] != 0:
              raise SystemExit("advertised Smol native acceptance failed; retained evidence is incomplete")
          report_path = output / "qualification.json"
          if not report_path.is_file() or report_path.stat().st_size > 256 * 1024:
              raise SystemExit("native acceptance did not generate a fresh bounded qualification report")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if (
              not isinstance(report, dict)
              or report.get("status") != "candidate_passed"
              or report.get("exact_final_engine_cleanup") is not True
          ):
              raise SystemExit("fresh native qualification report did not establish success and exact cleanup")
          PY
      - name: Upload advertised SmolLM2 qualification evidence
        if: ${{ always() && steps.qualify_smollm2.outcome != 'skipped' && steps.qualify_smollm2.outputs.evidence_dir != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-smollm2-q4-qualification
          path: ${{ steps.qualify_smollm2.outputs.evidence_dir }}/
          if-no-files-found: warn
