name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Rust checks (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: loxa-app/package.json
      - name: Install app dependencies
        working-directory: loxa-app
        run: pnpm install --frozen-lockfile
      - name: Reject generated or agent-context files
        shell: bash
        run: |
          tracked="$({ git ls-files; } | awk '/(^|\/)(\.superpowers|node_modules|target)(\/|$)/')"
          if [[ -n "$tracked" ]]; then
            echo "Generated or temporary paths must not be tracked:"
            echo "$tracked"
            exit 1
          fi
      - name: Check repository whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Verify committed lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets --locked
      - name: Build unsigned macOS app
        working-directory: loxa-app
        run: pnpm exec tauri build --ci --bundles app --no-sign
