name: Audit

on:
  pull_request:
    paths:
      - Cargo.toml
      - crates/**/Cargo.toml
      - loxa-app/src-tauri/Cargo.toml
      - Cargo.lock
      - deny.toml
      - rust-toolchain.toml
      - .github/workflows/audit.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - crates/**/Cargo.toml
      - loxa-app/src-tauri/Cargo.toml
      - Cargo.lock
      - deny.toml
      - rust-toolchain.toml
      - .github/workflows/audit.yml
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Install cargo-deny
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-deny
          fallback: none
      - name: Check dependencies
        run: cargo deny --locked check --warn unmaintained
