[package]
name = "loxa-app"
version = "0.1.0"
description = "Loxa native menu-bar companion"
authors = ["Muhammad Mahad"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/loxadev/loxa"
build = "build.rs"

[[test]]
name = "native_menu_hover"
path = "tests/native_menu_hover.rs"
harness = false

[[test]]
name = "native_menu_layout"
path = "tests/native_menu_layout.rs"
harness = false

[[test]]
name = "native_menu_search_focus"
path = "tests/native_menu_search_focus.rs"
harness = false

[[test]]
name = "native_observation_timer"
path = "tests/native_observation_timer.rs"
harness = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
loxa = { path = "../.." }
loxa-diagnostics = { version = "0.1.0-dev", path = "../../crates/loxa-diagnostics" }
loxa-ipc = { version = "0.1.0-dev", path = "../../crates/loxa-ipc" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time"] }

[dev-dependencies]
loxa = { path = "../..", features = ["test-support"] }
tauri = { version = "=2.11.5", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "=0.3.1", default-features = false, features = ["objc2", "std"] }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "NSApplication",
  "NSAccessibilityProtocols",
  "NSButton",
  "NSBezierPath",
  "NSBox",
  "NSCell",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSFont",
  "NSGraphicsContext",
  "NSImage",
  "NSImageView",
  "NSLayoutAnchor",
  "NSLayoutConstraint",
  "NSPopover",
  "NSParagraphStyle",
  "NSPasteboard",
  "NSProgressIndicator",
  "NSResponder",
  "NSSearchField",
  "NSStackView",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSText",
  "NSTextField",
  "NSTrackingArea",
  "NSViewController",
  "NSUserInterfaceLayout",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "NSArray",
  "NSDate",
  "NSGeometry",
  "NSObject",
  "NSRunLoop",
  "NSString",
  "NSTimer",
  "NSURL",
] }
