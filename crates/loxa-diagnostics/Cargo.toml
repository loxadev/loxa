[package]
name = "loxa-diagnostics"
version = "0.1.0-dev"
edition = "2021"
license = "Apache-2.0"
authors = ["Muhammad Mahad"]
repository = "https://github.com/loxadev/loxa"
description = "Bounded private diagnostics policy for Loxa processes"

[dependencies]
serde_json = "1.0.151"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
