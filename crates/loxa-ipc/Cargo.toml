[package]
name = "loxa-ipc"
version = "0.1.0-dev"
edition = "2021"
license = "Apache-2.0"
authors = ["Muhammad Mahad"]
repository = "https://github.com/loxadev/loxa"
description = "Private local IPC contract and client for Loxa"

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["codec"] }

[dev-dependencies]
tempfile = "3.27.0"
