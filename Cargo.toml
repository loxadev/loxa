[package]
name = "loxa"
version = "0.1.0-dev"
edition = "2021"
license = "Apache-2.0"
authors = ["Muhammad Mahad"]
repository = "https://github.com/loxadev/loxa"
description = "Download and run verified Hugging Face GGUF models locally"

[features]
test-support = []

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["fuzzy-select"] }
indicatif = "0.18.6"
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rustyline = { version = "18.0.1", default-features = false, features = ["signal-hook"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.52.0", default-features = false, features = ["rt", "time"] }
time = { version = "0.3.53", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
signal-hook = { version = "0.4.4", default-features = false, features = ["iterator"] }
sysinfo = { version = "0.39.5", default-features = false, features = ["disk", "system"] }

[dev-dependencies]
tempfile = "3.27.0"

[workspace]
members = ["loxa-app/src-tauri"]
default-members = ["."]
resolver = "2"
