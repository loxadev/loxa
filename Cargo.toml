[package]
name = "loxa"
version = "0.1.0-dev"
edition = "2021"
license = "Apache-2.0"
authors = ["Muhammad Mahad"]
repository = "https://github.com/loxadev/loxa"
description = "Download and run verified Hugging Face GGUF models locally"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4", features = ["derive"] }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm", "fuzzy"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"
signal-hook = "0.4.4"

[dev-dependencies]
tempfile = "3.27.0"

[workspace]
