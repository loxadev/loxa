[package]
name = "loxa-protocol"
version = "0.1.0"
edition.workspace = true
rust-version = "1.96"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared protocol types for Loxa"
readme = "../README.md"
include = ["src/**", "tests/**", "Cargo.toml"]
publish = true

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "=1.23.5", default-features = false, features = ["std", "v4"] }

[dev-dependencies]
serde_json = "1"
